<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .mydiv {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .div2 {
        width: 20%;
        margin: 10px auto;
        border: 2px solid black;
        padding: 50px 20px;
        border-radius: 10px;
        background-color: cornsilk;
        box-shadow: 10px 10px 10px gray;
      }
      .subbtn {
        display: flex;
        justify-content: center;
        padding-top: 20px;
      }
      .btn {
        padding: 12px 30px;
        background-color: red;
        color: white;
        font-weight: 900;
      }
      .btn:hover {
        background-color: rgb(236, 29, 29);
        cursor: pointer;
      }
      #email {
        height: 40px;
        width: 200px;
      }
      h3 {
        margin-bottom: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body class="mydiv">
    <div class="div2">
      <h3>Subscribe to know more</h3>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="enter your mail" />
      <div class="subbtn">
        <button id="subscribebtn" class="btn">subscribe</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
